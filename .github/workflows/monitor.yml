name: Naver Vacancy Monitor

on:
  schedule:
    # 5분마다 자동 실행 (Cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 웹에서 'Run workflow' 버튼으로 수동 즉시 테스트 가능

jobs:
  check-room:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 빈자리 조회 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py
